scenario: "health_gathering"
frame_height: 84
frame_width: 84
encode_size: 28
stack_frames: 4
frame_skip: 4
episode_timeout: 2100
timestep_T: 50
hidden_size: 128
# health_gathering buttons: TURN_LEFT, TURN_RIGHT, MOVE_FORWARD (no ATTACK).
# Must match src/env/vizdoom_wrapper.py:HEALTH_ACTIONS.
n_actions: 3
# Preserve full 4-frame stack (4*28*28=3136) — mean collapses motion cues
# needed to seek medkits and avoid acid. See preprocessing.stack_to_obs.
obs_mode: "stack"   # mean | stack
learning_rate: 0.00025
gamma: 0.99
seed: 0
eps_start: 1.0
eps_end: 0.1
# Slower decay: 2100-tick episodes need exploration far longer than basic.
eps_decay: 0.999
# Long horizon: 2100 steps/episode, so buffer must span many episodes.
replay_capacity: 50000
learn_start: 2048
max_steps: 2100
terminal_penalty: -10.0
# No shooting in health_gathering — HITCOUNT shaping disabled.
hit_bonus: 0.0
# Dense shaping on HEALTH delta (medkit pickup +, acid damage -).
# Applied as health_bonus * (health_now - health_prev), in addition to
# the env's +1/tick survival and -100 death rewards.
health_bonus: 0.02
reward_scale: 0.01
