scenario: "basic"          # basic | defend_the_center | health_gathering | deadly_corridor
frame_height: 84
frame_width: 84
encode_size: 28          # downsampled SNN input (28 or 16); 28*28=784 fits Cerebra-H
stack_frames: 4
frame_skip: 4
timestep_T: 50           # Poisson window; sweep {50, 25} in week 5
hidden_size: 128         # 128 -> 256 in week 6; total neurons must stay <= 1024
n_actions: 3             # basic: MOVE_LEFT/RIGHT, ATTACK
obs_mode: "mean"         # mean (784, legacy compat) | stack (3136, navigation)
learning_rate: 0.00025
gamma: 0.99
seed: 0
eps_start: 1.0
eps_end: 0.1
eps_decay: 0.995
replay_capacity: 20000
learn_start: 512
max_steps: 2000
terminal_penalty: -10.0
hit_bonus: 0.5
reward_scale: 0.01
